version: 2

models:
  - name: brd_licitantes
    description: >
      Bridge table que resolve a relação N:N entre fct_licitacoes e dim_fornecedores.
      Uma licitação tem muitos licitantes participantes, e um fornecedor pode participar
      de muitas licitações. Esta tabela expõe cada participação individualmente,
      permitindo análises de concentração de mercado e detecção de conluio.
      Granularidade: uma linha por (licitacao_id, nome_negociante).
    columns:
      - name: licitante_id
        description: "Chave primária do registro de participação (gerada pelo ETL)."
        tests: [unique, not_null]
      - name: licitacao_id
        description: "FK para fct_licitacoes. Pode ser nulo se a licitação não estiver no fato (dados órfãos)."
      - name: municipio_id
        description: "Identificador do município."
      - name: numero_licitacao
        description: "Número do processo licitatório (chave natural de junção com licitações)."
      - name: nome_negociante
        description: "Nome do licitante participante. FK para dim_fornecedores.nome_negociante."
      - name: documento_negociante
        description: "CPF ou CNPJ do licitante (pode ser nulo na fonte)."
      - name: data_realizacao_licitacao
        description: "Data de realização da licitação registrada no ato de participação."
      - name: updated_at
        description: "Timestamp de atualização do registro."
