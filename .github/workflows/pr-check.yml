name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:

  # ──────────────────────────────────────────────────────────
  # Validação de Tamanho do PR
  # ──────────────────────────────────────────────────────────
  size-check:
    name: 📏 PR Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR Size
        run: |
          CHANGED=$(git diff --shortstat origin/${{ github.base_ref }}...HEAD | awk '{print $4+$6}')
          echo "Lines changed: $CHANGED"
          if [ "$CHANGED" -gt 800 ]; then
            echo "❌ PR muito grande ($CHANGED linhas). Divida em PRs menores."
            exit 1
          elif [ "$CHANGED" -gt 300 ]; then
            echo "⚠️ PR grande ($CHANGED linhas). Considere dividir."
          else
            echo "✅ Tamanho do PR OK ($CHANGED linhas)"
          fi
