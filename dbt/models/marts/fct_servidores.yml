version: 2

models:
  - name: fct_servidores
    description: >
      Cadastro funcional de servidores públicos por ano de exercício.
      Contém cargo, vínculo empregatício, situação funcional e carga horária semanal.
      Granularidade: uma linha por (agente_publico_id, ano_exercicio).

      LIMITAÇÃO CONHECIDA — SEM dados de remuneração: a API TCE-CE não expõe folha
      de pagamento nem salários individuais. O campo valor_carga_horaria representa
      horas semanais de trabalho (ex: 44 horas), NÃO um valor monetário em reais.
      O agente nunca deve inferir salário a partir desta tabela.
      Para despesas com pessoal em nível agregado, use fct_despesas filtrado por
      elemento de despesa ou função orçamentária de pessoal.
    columns:
      - name: agente_publico_id
        description: "Chave primária do registro de servidor."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Identificador do município."
      - name: nome_municipio
        description: "Nome do município (desnormalizado)."
      - name: ano_exercicio
        description: "Ano de exercício ao qual o registro pertence."
      - name: nome_servidor
        description: "Nome completo do servidor público."
      - name: cargo
        description: "Denominação do cargo ocupado."
      - name: tipo_cargo_label
        description: "Rótulo do tipo: 'Efetivo', 'Comissionado', 'Temporário', 'Não informado', 'Outros'."
      - name: situacao_funcional_label
        description: "Rótulo legível: 'Ativo', 'Inativo', 'Aposentado', 'Outros'."
      - name: is_ativo
        description: "Verdadeiro quando o servidor está em situação ativa."
      - name: is_comissionado
        description: "Verdadeiro quando o tipo de cargo é Comissionado."
      - name: is_efetivo
        description: "Verdadeiro quando o tipo de cargo é Efetivo."
      - name: valor_carga_horaria
        description: "Carga horária semanal do servidor em horas."
        meta:
          semantic_type: work_hours
      - name: faixa_carga_horaria
        description: "Classificação: 'Meio período' (<= 20h), 'Integral' (21–40h), 'Estendida' (> 40h), 'Não informada'."
      - name: updated_at
        description: "Timestamp da última atualização."
