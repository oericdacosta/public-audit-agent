x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: civic-audit-airflow:latest
  user: "${AIRFLOW_UID:-1000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_PG_USER:-airflow}:${AIRFLOW_PG_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_PG_DB:-airflow}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-change-me-in-production}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Fortaleza
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    PYTHONPATH: /opt/airflow/app
    DUCKDB_PATH: /opt/airflow/app/data/civic_audit.duckdb
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    MCP_HOST: ${MCP_HOST:-localhost}
    MCP_PORT: ${MCP_PORT:-8000}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/app/src
    - ./dbt:/opt/airflow/app/dbt
    - ./config.yaml:/opt/airflow/app/config.yaml:ro
    - ./data:/opt/airflow/app/data
    - ./logs/airflow:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock

services:
  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${AIRFLOW_PG_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_PG_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_PG_DB:-airflow}
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        chown -R airflow:0 /opt/airflow/logs &&
        chmod -R a+rwX /opt/airflow/logs &&
        chmod -R a+rwX /opt/airflow/app/data &&
        su airflow -s /bin/bash -c '
          airflow db migrate &&
          airflow users create \
            --username '"$${AIRFLOW_ADMIN_USER}"' \
            --password '"$${AIRFLOW_ADMIN_PASSWORD}"' \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email admin@civic-audit.local &&
          airflow pools set etl_pool 1 "Pool para execução sequencial do ETL (DuckDB single-writer)"
        '
    restart: "no"
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver --port 8080
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-pgdata:
