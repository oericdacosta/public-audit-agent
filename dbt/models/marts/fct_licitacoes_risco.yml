version: 2

models:
  - name: fct_licitacoes_risco
    description: >
      Fato de licitações enriquecido com foco em conformidade e detecção de
      irregularidades. Seletor fino sobre int_licitacoes_risco, que concentra toda
      a lógica de score e flags de risco. Use para análise consolidada de risco
      por processo licitatório.
      Granularidade: uma linha por licitacao_id.
    columns:
      - name: licitacao_id
        description: "Chave primária da licitação."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Identificador do município."
      - name: nome_municipio
        description: "Nome do município (desnormalizado)."
      - name: objeto_licitacao
        description: "Descrição do objeto licitado."
      - name: modalidade_licitacao_label
        description: "Rótulo legível da modalidade licitatória."
      - name: valor_estimado
        description: "Valor estimado pelo órgão em R$."
        meta:
          semantic_type: monetary_brl
      - name: valor_total_vencedor
        description: "Valor adjudicado aos vencedores em R$."
        meta:
          semantic_type: monetary_brl
      - name: desvio_valor_absoluto
        description: "Diferença absoluta entre valor_total_vencedor e valor_estimado."
        meta:
          semantic_type: monetary_brl
      - name: desvio_valor_percentual
        description: "Desvio percentual entre valor contratado e estimado."
      - name: flag_possivel_superfaturamento
        description: "Verdadeiro quando o valor vencedor supera o estimado em mais de 10%."
      - name: flag_licitacao_deserta
        description: "Verdadeiro quando sem participantes."
      - name: flag_unico_participante
        description: "Verdadeiro quando apenas um participante."
      - name: flag_dispensa_acima_limite
        description: "Verdadeiro quando dispensa supera o limite legal de R$50 mil."
      - name: score_risco
        description: "Score de risco de 0 a 4: soma dos quatro flags de irregularidade. Quanto maior, mais atenção requer."
      - name: updated_at
        description: "Timestamp de atualização."
