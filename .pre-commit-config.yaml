repos:
  # ─────────────────────────────────────────────────────────────
  # Ruff - Linting e Formatting ultra-rápido
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ─────────────────────────────────────────────────────────────
  # Type Checking com MyPy
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-PyYAML
          - types-requests
        args: [--ignore-missing-imports]
        files: ^src/

  # ─────────────────────────────────────────────────────────────
  # SQL Linting (SQLFluff)
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.2.5
    hooks:
      - id: sqlfluff-lint
        additional_dependencies: ['dbt-duckdb', 'dbt-core', 'sqlfluff-templater-dbt']
      - id: sqlfluff-fix
        additional_dependencies: ['dbt-duckdb', 'dbt-core', 'sqlfluff-templater-dbt']
        args: [--config, .sqlfluff]


  # ─────────────────────────────────────────────────────────────
  # dbt Governance (Metadata & Docs)
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v2.0.6
    hooks:
      - id: check-model-has-description
        args: ["--manifest", "dbt/target/manifest.json"]
        exclude: ^src/etl/schema/
      - id: check-model-columns-have-desc
        args: ["--manifest", "dbt/target/manifest.json"]
      - id: check-source-table-has-description
        args: ["--manifest", "dbt/target/manifest.json"]



  # ─────────────────────────────────────────────────────────────
  # Validações Gerais
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key
      - id: check-merge-conflict

  # ─────────────────────────────────────────────────────────────
  # Detecção de Secrets
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json
