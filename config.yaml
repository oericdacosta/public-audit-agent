# CivicAudit Configuration

# Application Settings
app:
  name: "Public Audit Agent"
  version: "0.1.0"
  env: "development"

# Data Sources (TCE-CE)
tce:
  base_url: "https://api-dados-abertos.tce.ce.gov.br"
  sim_base_url: "https://api-dados-abertos.tce.ce.gov.br"
  rate_limit: 5
  circuit_fail_max: 20
  circuit_reset_timeout: 30

# Audit Target Scope
audit:
  city_code: "162" # Sobral
  data_retention_years: 10 # Rolling window (last 10 years)

# AI Agents Configuration
agent:
  analyst_model: "gpt-4o"
  critic_model: "gpt-4o-mini"
  fiscal_model: "gpt-4o"  # SQL specialist model
  planner_model: "gpt-4o"  # Planning agent model
  guardrail_model: "gpt-4o-mini"  # Safety check model (cost-effective)
  editor_model: "gpt-4o-mini"  # Narrative formatting agent (cost-effective)
  max_retries: 3
  recursion_limit: 30  # Max workflow iterations

# Database Configuration
database:
  path: "data/civic_audit.duckdb"
  query_timeout: 30  # Query timeout in seconds

# Airflow Orchestration
airflow:
  schedule: "0 3 * * *"          # Cron: diário às 3h
  max_active_runs: 1             # Sem execuções paralelas
  sequential_years: true         # Processar anos sequencialmente
  year_delay_seconds: 2          # Delay entre anos (anti-WAF)
  pool_slots: 1                  # Slots do pool ETL (DuckDB single-writer)

# Sandbox Configuration
sandbox:
  image: "python:3.12-slim"
  timeout: 30
  memory_limit: "512m"
