version: 2

models:
  - name: stg_orcamento_despesa
    description: >
      Orcamento de despesa por projeto e atividade (LOA). Expoe todos os campos do raw_data
      incluindo o valor fixado na Lei Orcamentaria Anual. Granularidade: um projeto/atividade por linha.
    columns:
      - name: orcamento_despesa_id
        description: "Chave primaria."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Codigo do municipio."
        tests: [not_null]
      - name: ano_exercicio
        description: "Ano de exercicio orcamentario (normalizado de YYYYMM para YYYY quando necessario)."
      - name: codigo_orgao
        description: "Codigo do orgao responsavel (extraido de raw_data)."
      - name: codigo_unidade_orcamentaria
        description: "Codigo da unidade orcamentaria (extraido de raw_data)."
      - name: codigo_funcao
        description: "Codigo da funcao orcamentaria (ex: 12 = Educacao, 10 = Saude)."
      - name: codigo_subfuncao
        description: "Codigo da subfuncao orcamentaria."
      - name: codigo_programa
        description: "Codigo do programa orcamentario."
      - name: codigo_projeto_atividade
        description: "Codigo do projeto ou atividade."
      - name: numero_projeto_atividade
        description: "Numero sequencial do projeto ou atividade."
      - name: codigo_tipo_orcamento
        description: "Tipo de orcamento: F = Fiscal, S = Seguridade Social."
      - name: nome_projeto_atividade
        description: "Descricao do projeto ou atividade."
      - name: valor_fixado_loa
        description: "Valor total fixado na LOA para este projeto/atividade em R$. Fonte: valor_total_fixado_projeto_atividade do raw_data."
      - name: updated_at
        description: "Timestamp da ultima carga."
