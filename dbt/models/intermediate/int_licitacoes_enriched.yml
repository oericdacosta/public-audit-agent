version: 2

models:
  - name: int_licitacoes_enriched
    description: "Licitações enriquecidas com agregações de licitantes e itens. Granularidade: uma linha por licitacao_id. Nota: documento_negociante é nulo em stg_licitantes — quantidade de licitantes calculada por nome_negociante."
    columns:
      - name: licitacao_id
        description: "Chave primária da licitação."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Identificador do município."
      - name: ano_exercicio
        description: "Ano de exercício fiscal."
      - name: numero_licitacao
        description: "Número identificador da licitação."
      - name: numero_processo
        description: "Número do processo administrativo. Nulo na fonte."
      - name: objeto_licitacao
        description: "Descrição do objeto da licitação. Nulo na fonte."
      - name: modalidade_licitacao
        description: "Código da modalidade: 1=Convite, 2=Tomada de Preços, 3=Concorrência, 4=Concurso, 5=Pregão, 6=Dispensa, 7=Inexigibilidade."
      - name: modalidade_licitacao_label
        description: "Descrição textual da modalidade de licitação."
      - name: is_dispensa
        description: "Verdadeiro para modalidades de dispensa (6) ou inexigibilidade (7)."
      - name: is_pregao
        description: "Verdadeiro quando a modalidade é Pregão (5)."
      - name: data_realizacao
        description: "Data de realização da licitação."
      - name: ano_realizacao
        description: "Ano de realização extraído de data_realizacao."
      - name: valor_estimado
        description: "Valor estimado da licitação. Nulo para muitos registros."
      - name: is_alto_valor
        description: "Verdadeiro quando o valor estimado supera R$650 mil."
      - name: faixa_valor
        description: "Faixa de valor estimado: 'acima de R$650k', 'R$100k a R$650k', 'até R$100k' ou 'não informado'."
      - name: situacao_licitacao
        description: "Situação da licitação. Nula na fonte."
      - name: flag_licitacao_deserta
        description: "Verdadeiro quando nenhum licitante participou."
      - name: flag_unico_participante
        description: "Verdadeiro quando apenas um licitante participou."
      - name: quantidade_licitantes
        description: "Quantidade de licitantes distintos por nome."
      - name: total_itens
        description: "Total de itens da licitação."
      - name: valor_total_vencedor
        description: "Soma dos valores vencedores dos itens da licitação."
      - name: updated_at
        description: "Timestamp da última atualização do registro."
