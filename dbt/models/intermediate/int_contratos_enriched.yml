version: 2

models:
  - name: int_contratos_enriched
    description: "Contratos enriquecidos com dados do contratado (deduplicado) e negociante. Granularidade: uma linha por contrato_id. Nota: stg_negociantes está vazia — a junção retornará nulos até que dados sejam populados. Deduplicação de contratados aplica ROW_NUMBER por (numero_contrato, municipio_id) priorizando data_contrato mais recente."
    columns:
      - name: contrato_id
        description: "Chave primária do contrato."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Identificador do município."
      - name: numero_contrato
        description: "Número do contrato."
      - name: data_contrato
        description: "Data de assinatura do contrato."
      - name: data_inicio_vigencia
        description: "Data de início da vigência. Nula na fonte."
      - name: data_fim_vigencia
        description: "Data de término da vigência. Nula na fonte."
      - name: valor_total
        description: "Valor total do contrato. Nulo na fonte."
      - name: descricao_objeto
        description: "Descrição do objeto contratado. Nula na fonte."
      - name: tipo_contrato
        description: "Tipo do contrato."
      - name: nome_negociante
        description: "Nome do contratado (fornecedor)."
      - name: documento_negociante
        description: "CPF ou CNPJ do contratado. Nulo na fonte."
      - name: endereco_negociante
        description: "Endereço do negociante (de stg_negociantes, tabela vazia)."
      - name: telefone_negociante
        description: "Telefone do negociante (de stg_negociantes, tabela vazia)."
      - name: uf_negociante
        description: "UF do negociante (de stg_negociantes, tabela vazia)."
      - name: duracao_vigencia_dias
        description: "Duração da vigência em dias. Nulo quando datas de vigência são nulas."
      - name: flag_contrato_ativo
        description: "Verdadeiro quando a data atual está dentro do período de vigência."
      - name: flag_contrato_vencido
        description: "Verdadeiro quando a data de fim de vigência é anterior à data atual."
      - name: dias_para_vencer
        description: "Número de dias até o vencimento do contrato. Negativo para contratos vencidos."
      - name: is_alto_valor
        description: "Verdadeiro quando o valor total supera R$650 mil."
      - name: faixa_valor_contrato
        description: "Faixa de valor: 'acima de R$650k', 'R$50k a R$650k', 'até R$50k' ou 'não informado'."
      - name: is_pessoa_juridica
        description: "Verdadeiro quando o documento do contratado possui 14 dígitos (CNPJ)."
      - name: updated_at
        description: "Timestamp da última atualização do registro."
