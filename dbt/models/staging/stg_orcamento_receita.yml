version: 2

models:
  - name: stg_orcamento_receita
    description: "Orçamento de receita por rubrica (LOA). Granularidade: uma rubrica por linha."
    columns:
      - name: orcamento_receita_id
        description: "Chave primária."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Código do município."
        tests: [not_null]
      - name: codigo_receita
        description: "Código da rubrica de receita."
      - name: descricao_receita
        description: "Descrição da rubrica."
      - name: ano_exercicio
        description: "Ano de exercício orçamentário."
      - name: updated_at
        description: "Timestamp da última carga."
