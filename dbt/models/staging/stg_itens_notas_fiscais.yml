version: 2

models:
  - name: stg_itens_notas_fiscais
    description: "Itens individuais das notas fiscais. Granularidade: um item por nota por linha."
    columns:
      - name: item_nota_fiscal_id
        description: "Chave primária."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Código do município."
        tests: [not_null]
      - name: numero_nota_fiscal
        description: "Número da nota fiscal."
      - name: descricao_item
        description: "Descrição do item."
      - name: quantidade
        description: "Quantidade do item."
      - name: valor_unitario
        description: "Valor unitário em reais."
      - name: valor_total
        description: "Valor total do item em reais."
      - name: ano_exercicio
        description: "Ano de exercício orçamentário."
      - name: updated_at
        description: "Timestamp da última carga."
