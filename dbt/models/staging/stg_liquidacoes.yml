version: 2

models:
  - name: stg_liquidacoes
    description: "Liquidações de empenhos. Granularidade: uma liquidação por linha."
    columns:
      - name: liquidacao_id
        description: "Chave primária."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Código do município."
        tests: [not_null]
      - name: numero_empenho
        description: "Número do empenho liquidado."
      - name: data_liquidacao
        description: "Data da liquidação."
      - name: valor_liquidado
        description: "Valor liquidado em reais."
      - name: nome_responsavel_liquidacao
        description: "Nome do responsável pela liquidação."
      - name: ano_exercicio
        description: "Ano de exercício orçamentário."
      - name: updated_at
        description: "Timestamp da última carga."
