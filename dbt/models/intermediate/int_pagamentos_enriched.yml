version: 2

models:
  - name: int_pagamentos_enriched
    description: "Notas de pagamento enriquecidas com campos derivados de data e classificação de valor. Granularidade: uma linha por nota_pagamento_id. Nota: não há FK compartilhada entre stg_notas_pagamentos e stg_liquidacoes — a cadeia Empenho→Liquidação→Pagamento não pode ser reconstruída a partir dos dados disponíveis."
    columns:
      - name: nota_pagamento_id
        description: "Chave primária da nota de pagamento."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Identificador do município."
      - name: ano_exercicio
        description: "Ano de exercício fiscal."
      - name: numero_nota_pagamento
        description: "Número da nota de pagamento."
      - name: data_nota_pagamento
        description: "Data da nota de pagamento."
      - name: valor_nota_pagamento
        description: "Valor total da nota de pagamento."
      - name: nome_pagador
        description: "Nome do pagador responsável."
      - name: mes_pagamento_date
        description: "Primeiro dia do mês de pagamento (truncado)."
      - name: ano_pagamento
        description: "Ano extraído de data_nota_pagamento."
      - name: mes_pagamento
        description: "Mês numérico extraído de data_nota_pagamento."
      - name: nome_mes_pagamento
        description: "Nome do mês de pagamento em português."
      - name: is_alto_valor
        description: "Verdadeiro quando o valor da nota supera R$100 mil."
      - name: updated_at
        description: "Timestamp da última atualização do registro."
