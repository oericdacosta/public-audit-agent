version: 2

models:
  - name: brd_licitacoes_vencedores
    description: >
      Itens de licitação com vencedores, enriquecidos com contexto do processo licitatório.
      Permite responder "quem ganhou a licitação X?", "qual empresa venceu mais licitações?",
      "qual o valor adjudicado por item?".
      Granularidade: uma linha por item de licitação (item_licitacao_id).

      NOTA: cada licitação pode ter múltiplos itens com vencedores diferentes.
      Para análise agregada por processo, prefira fct_licitacoes ou fct_licitacoes_risco.
    columns:
      - name: item_licitacao_id
        description: "Chave primária do item de licitação."
        tests: [unique, not_null]
      - name: licitacao_id
        description: "Chave estrangeira para fct_licitacoes. Nulo quando não há correspondência de número."
      - name: municipio_id
        description: "Identificador do município."
      - name: nome_municipio
        description: "Nome do município (desnormalizado)."
      - name: numero_licitacao
        description: "Número do processo licitatório."
      - name: ano_exercicio
        description: "Ano de exercício da licitação."
      - name: modalidade_licitacao_label
        description: "Rótulo legível da modalidade licitatória (ex: Pregão, Dispensa)."
      - name: data_realizacao_licitacao
        description: "Data de realização da licitação."
      - name: numero_sequencial_item
        description: "Número sequencial do item dentro da licitação."
      - name: descricao_item
        description: "Descrição do item licitado."
      - name: nome_vencedor
        description: "Nome da empresa ou pessoa vencedora do item."
      - name: quantidade
        description: "Quantidade licitada do item."
      - name: valor_unitario
        description: "Valor unitário do item adjudicado em R$."
        meta:
          semantic_type: monetary_brl
      - name: valor_adjudicado
        description: "Valor total adjudicado para o item (valor_vencedor) em R$."
        meta:
          semantic_type: monetary_brl
      - name: updated_at
        description: "Timestamp da última atualização."
