version: 2

models:
  - name: int_arrecadacao_unificada
    description: "União de talões de receitas orçamentárias e extra-orçamentárias com discriminador de tipo. Granularidade: uma linha por talão. Colunas exclusivas de cada fonte recebem null na outra: codigo_rubrica/tipo_fonte/codigo_fonte apenas em ORCAMENTARIA; codigo_conta_extra apenas em EXTRA_ORCAMENTARIA."
    columns:
      - name: talao_id
        description: "Identificador único do talão (talao_receita_id ou talao_extra_id)."
        tests: [unique, not_null]
      - name: tipo_arrecadacao
        description: "Tipo de arrecadação: 'ORCAMENTARIA' ou 'EXTRA_ORCAMENTARIA'."
      - name: municipio_id
        description: "Identificador do município."
      - name: ano_exercicio
        description: "Ano de exercício fiscal."
      - name: codigo_orgao
        description: "Código do órgão arrecadador."
      - name: codigo_unidade
        description: "Código da unidade orçamentária (trimmed na fonte)."
      - name: numero_talao
        description: "Número do talão de receita."
      - name: data_talao
        description: "Data do talão de receita."
      - name: data_referencia_int
        description: "Mês de referência no formato inteiro YYYYMM."
      - name: valor_receita
        description: "Valor arrecadado no talão."
      - name: historico_receita
        description: "Histórico ou descrição da receita."
      - name: nome_contribuinte
        description: "Nome do contribuinte."
      - name: numero_banco
        description: "Número do banco de crédito."
      - name: numero_agencia
        description: "Número da agência bancária."
      - name: numero_conta_corrente
        description: "Número da conta corrente."
      - name: data_credito
        description: "Data do crédito bancário."
      - name: codigo_rubrica
        description: "Código da rubrica. Disponível apenas para receitas orçamentárias."
      - name: tipo_fonte
        description: "Tipo da fonte de recursos. Disponível apenas para receitas orçamentárias."
      - name: codigo_fonte
        description: "Código da fonte de recursos. Disponível apenas para receitas orçamentárias."
      - name: codigo_conta_extra
        description: "Código da conta extra-orçamentária. Disponível apenas para talões extras."
      - name: mes_arrecadacao
        description: "Primeiro dia do mês de arrecadação (date_trunc da data do talão)."
