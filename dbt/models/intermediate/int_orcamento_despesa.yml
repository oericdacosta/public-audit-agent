version: 2

models:
  - name: int_orcamento_despesa
    description: >
      Orcamento de despesa enriquecido com nomes de funcao, programa e orgao.
      Camada intermediaria entre stg_orcamento_despesa e as marts de orcamento.
      Granularidade: um projeto/atividade por linha (igual ao staging).
    columns:
      - name: orcamento_despesa_id
        description: "Chave primaria herdada do staging."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Codigo do municipio."
        tests: [not_null]
      - name: ano_exercicio
        description: "Ano de exercicio orcamentario."
      - name: codigo_orgao
        description: "Codigo do orgao."
      - name: nome_orgao
        description: "Nome do orgao (desnormalizado de stg_orgaos)."
      - name: codigo_unidade_orcamentaria
        description: "Codigo da unidade orcamentaria."
      - name: codigo_funcao
        description: "Codigo da funcao orcamentaria."
      - name: nome_funcao
        description: "Nome da funcao orcamentaria (ex: Educacao, Saude, Cultura)."
      - name: codigo_subfuncao
        description: "Codigo da subfuncao."
      - name: codigo_programa
        description: "Codigo do programa."
      - name: nome_programa
        description: "Nome do programa orcamentario."
      - name: codigo_projeto_atividade
        description: "Codigo do projeto ou atividade."
      - name: numero_projeto_atividade
        description: "Numero sequencial do projeto ou atividade."
      - name: codigo_tipo_orcamento
        description: "Tipo de orcamento: F = Fiscal, S = Seguridade Social."
      - name: tipo_orcamento
        description: "Descricao do tipo de orcamento (ex: Fiscal, Seguridade Social)."
      - name: nome_projeto_atividade
        description: "Descricao do projeto ou atividade."
      - name: valor_fixado_loa
        description: "Valor total fixado na LOA em R$."
      - name: updated_at
        description: "Timestamp da ultima carga."
