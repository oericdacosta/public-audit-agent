version: 2

models:
  - name: int_contratos_fornecedores
    description: >
      Contratos enriquecidos com o perfil completo do fornecedor. Faz o join entre
      int_contratos_enriched e int_fornecedores_enriquecido, adicionando indicadores
      de concentração e risco de fornecedor. Base para obt_contratos_fornecedores.
    columns:
      - name: contrato_id
        description: "Chave primária do contrato."
      - name: municipio_id
        description: "Identificador do município."
      - name: nome_municipio
        description: "Nome do município (desnormalizado)."
      - name: valor_contrato
        description: "Valor total do contrato."
      - name: nome_fornecedor
        description: "Nome do fornecedor contratado."
      - name: fornecedor_total_contratos
        description: "Total histórico de contratos deste fornecedor em todos os municípios."
      - name: fornecedor_valor_total_acumulado
        description: "Soma de todos os contratos do fornecedor."
      - name: flag_contratado_sem_licitacao
        description: "True se o fornecedor nunca participou de licitações."
      - name: flag_fornecedor_recorrente_alto_valor
        description: "True se o fornecedor tem 5+ contratos e este é de alto valor."
