version: 2

models:
  - name: stg_balancete_receita_extra
    description: "Balancete mensal de receitas extra-orçamentárias. Granularidade: um registro por linha."
    columns:
      - name: balancete_receita_extra_id
        description: "Chave primária."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Código do município."
        tests: [not_null]
      - name: ano_exercicio
        description: "Ano de exercício orçamentário."
      - name: mes_referencia
        description: "Mês de referência no formato YYYYMM."
      - name: updated_at
        description: "Timestamp da última carga dos dados."
