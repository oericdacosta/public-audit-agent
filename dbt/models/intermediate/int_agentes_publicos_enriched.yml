version: 2

models:
  - name: int_agentes_publicos_enriched
    description: "Agentes públicos enriquecidos com labels de tipo de cargo, situação funcional e faixa de carga horária. Granularidade: uma linha por agente_publico_id. Nota: coluna cargo é nula na fonte. Não há FK de órgão disponível para enriquecimento."
    columns:
      - name: agente_publico_id
        description: "Chave primária do agente público."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Identificador do município."
      - name: ano_exercicio
        description: "Ano de exercício fiscal."
      - name: cpf_servidor
        description: "CPF do servidor público."
      - name: nome_servidor
        description: "Nome do servidor público."
      - name: numero_matricula
        description: "Número de matrícula funcional."
      - name: cargo
        description: "Cargo do servidor. Nulo na fonte de dados."
      - name: tipo_cargo
        description: "Código do tipo de cargo."
      - name: tipo_cargo_label
        description: "Label do tipo de cargo: Efetivo, Comissionado, Temporário, Não informado ou Outros."
      - name: situacao_funcional
        description: "Código da situação funcional."
      - name: situacao_funcional_label
        description: "Label da situação funcional: Ativo, Inativo, Aposentado ou Outros."
      - name: is_ativo
        description: "Verdadeiro quando o agente está em situação funcional ativa."
      - name: is_comissionado
        description: "Verdadeiro quando o tipo de cargo é comissionado."
      - name: is_efetivo
        description: "Verdadeiro quando o tipo de cargo é efetivo."
      - name: codigo_vinculo
        description: "Código do vínculo funcional."
      - name: codigo_ingresso
        description: "Código da forma de ingresso no serviço público."
      - name: valor_carga_horaria
        description: "Carga horária semanal do servidor."
      - name: faixa_carga_horaria
        description: "Classificação da carga horária: Meio período (até 20h), Integral (21-40h), Estendida (>40h) ou Não informada."
      - name: updated_at
        description: "Timestamp da última atualização do registro."
