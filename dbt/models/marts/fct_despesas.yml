version: 2

models:
  - name: fct_despesas
    description: >
      Fato de despesas orçamentárias oriundo do balancete mensal (não de empenhos individuais).
      Cada linha representa o saldo acumulado de gastos de um órgão/função em um mês específico.
      Tabela de referência para análise detalhada de gastos: filtros por órgão, função,
      programa, status de execução e valores. Para totais agregados, prefira
      agg_despesas_por_orgao_ano ou agg_despesas_por_funcao_ano.
      Granularidade: uma linha por (municipio_id, ano_exercicio, mes_referencia, codigo_orgao, codigo_funcao).
      O campo despesa_id é uma chave sintética gerada pelo ETL — não representa um empenho individual.

      LIMITAÇÃO CONHECIDA — ausência de FK na fonte TCE-CE:
      Não existe ligação entre despesas e contratos (fct_contratos) nem entre despesas
      e licitações (fct_licitacoes) nos dados fornecidos pela API. Não é possível rastrear
      "qual contrato autorizou este empenho?" ou "qual licitação gerou este pagamento?".
    columns:
      - name: despesa_id
        description: "Chave primária do empenho de despesa."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Identificador do município."
      - name: nome_municipio
        description: "Nome do município (desnormalizado)."
      - name: ano_exercicio
        description: "Ano de exercício fiscal."
      - name: mes_referencia
        description: "Mês de referência no formato YYYYMM."
      - name: mes_referencia_date
        description: "Primeiro dia do mês de referência (tipo date)."
      - name: trimestre
        description: "Trimestre: T1, T2, T3 ou T4."
      - name: codigo_orgao
        description: "Código do órgão responsável pela despesa."
      - name: nome_orgao
        description: "Nome do órgão responsável pela despesa."
      - name: codigo_funcao
        description: "Código da função orçamentária."
      - name: nome_funcao
        description: "Nome da função (ex: Saúde, Educação, Administração)."
      - name: nome_programa
        description: "Nome do programa governamental."
      - name: grupo_despesa
        description: "Grupo econômico: 'Despesas Correntes', 'Despesas de Capital' ou 'Outros'."
      - name: valor_empenhado
        description: "Valor empenhado (comprometido) em R$."
        meta:
          semantic_type: monetary_brl
      - name: valor_liquidado
        description: "Valor liquidado (serviço/bem entregue confirmado) em R$."
        meta:
          semantic_type: monetary_brl
      - name: valor_pago
        description: "Valor efetivamente pago em R$."
        meta:
          semantic_type: monetary_brl
      - name: valor_nao_pago
        description: "Diferença entre valor_liquidado e valor_pago (pendente de pagamento)."
        meta:
          semantic_type: monetary_brl
      - name: percentual_executado
        description: "Percentual de execução: valor_pago / valor_empenhado * 100."
        meta:
          semantic_type: ratio
      - name: status_execucao
        description: "Status: 'pago_integralmente', 'pago_parcialmente', 'liquidado_nao_pago' ou 'empenhado_nao_liquidado'."
      - name: is_pago_integralmente
        description: "Verdadeiro quando valor_pago >= valor_empenhado."
      - name: updated_at
        description: "Timestamp da última atualização."
