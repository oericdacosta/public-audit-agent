version: 2

models:
  - name: stg_contas_bancarias
    description: "Contas bancárias do município. Granularidade: uma conta por linha."
    columns:
      - name: conta_bancaria_id
        description: "Chave primária."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Código do município."
        tests: [not_null]
      - name: numero_banco
        description: "Código do banco."
      - name: numero_agencia
        description: "Número da agência bancária."
      - name: numero_conta
        description: "Número da conta bancária."
      - name: descricao_conta
        description: "Descrição da conta."
      - name: ano_exercicio
        description: "Ano de exercício orçamentário."
      - name: updated_at
        description: "Timestamp da última carga."
