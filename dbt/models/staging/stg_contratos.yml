version: 2

models:
  - name: stg_contratos
    description: "Contratos celebrados pelo município. Granularidade: um contrato por linha."
    columns:
      - name: contrato_id
        description: "Chave primária."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Código do município."
        tests: [not_null]
      - name: numero_contrato
        description: "Número identificador do contrato."
      - name: data_contrato
        description: "Data de assinatura."
      - name: data_inicio_vigencia
        description: "Início da vigência contratual."
      - name: data_fim_vigencia
        description: "Fim da vigência contratual."
      - name: valor_total
        description: "Valor total do contrato em reais."
      - name: descricao_objeto
        description: "Objeto do contrato."
      - name: tipo_contrato
        description: "Tipo do contrato."
      - name: updated_at
        description: "Timestamp da última carga."
