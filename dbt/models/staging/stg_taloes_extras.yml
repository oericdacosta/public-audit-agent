version: 2

models:
  - name: stg_taloes_extras
    description: "Talões de receita extra-orçamentária. Granularidade: um talão por linha."
    columns:
      - name: talao_extra_id
        description: "Chave primária."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Código do município."
        tests: [not_null]
      - name: ano_exercicio
        description: "Ano de exercício orçamentário."
      - name: codigo_municipio
        description: "Código numérico do município."
      - name: codigo_orgao
        description: "Código do órgão."
      - name: codigo_unidade
        description: "Código da unidade orçamentária."
      - name: codigo_conta_extra
        description: "Código da conta extra-orçamentária."
      - name: numero_talao
        description: "Número do talão."
      - name: data_talao
        description: "Data de emissão do talão."
      - name: data_referencia_int
        description: "Data de referência em formato inteiro (YYYYMM)."
      - name: valor_receita
        description: "Valor da receita em reais."
      - name: historico_receita
        description: "Histórico/descrição da receita."
      - name: tipo_doc_contribuinte
        description: "Tipo de documento do contribuinte."
      - name: numero_doc_contribuinte
        description: "Número do documento do contribuinte."
      - name: nome_contribuinte
        description: "Razão social ou nome do contribuinte."
      - name: numero_banco
        description: "Código do banco."
      - name: numero_agencia
        description: "Número da agência bancária."
      - name: numero_conta_corrente
        description: "Número da conta corrente."
      - name: numero_doc_credito
        description: "Número do documento de crédito."
      - name: data_credito
        description: "Data do crédito bancário."
      - name: tipo_doc_credito
        description: "Tipo do documento de crédito."
      - name: updated_at
        description: "Timestamp da última carga."
