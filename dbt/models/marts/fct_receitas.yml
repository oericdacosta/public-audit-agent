version: 2

models:
  - name: fct_receitas
    description: >
      Fato de receitas orçamentárias. Uma linha por receita_id.
      Usado para análise de arrecadação: comparar meta orçada vs realizado,
      identificar receitas abaixo da meta e acompanhar performance por órgão.
      Granularidade: uma linha por receita_id.
    columns:
      - name: receita_id
        description: "Chave primária da receita."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Identificador do município."
      - name: nome_municipio
        description: "Nome do município (desnormalizado)."
      - name: ano_exercicio
        description: "Ano de exercício fiscal."
      - name: mes_referencia
        description: "Mês de referência no formato YYYYMM."
      - name: mes_referencia_date
        description: "Primeiro dia do mês de referência (tipo date)."
      - name: trimestre
        description: "Trimestre: T1, T2, T3 ou T4."
      - name: codigo_orgao
        description: "Código do órgão arrecadador."
      - name: nome_orgao
        description: "Nome do órgão arrecadador."
      - name: codigo_receita
        description: "Código de classificação da receita."
      - name: descricao_receita
        description: "Descrição da natureza da receita (ex: IPTU, ISS, Transferências Federais)."
      - name: valor_orcado
        description: "Valor previsto no orçamento para esta receita em R$."
      - name: valor_arrecadado
        description: "Valor efetivamente arrecadado em R$."
      - name: desvio_arrecadacao
        description: "Diferença entre arrecadado e orçado (positivo = superávit, negativo = déficit)."
      - name: percentual_arrecadado
        description: "Percentual arrecadado em relação ao orçado: valor_arrecadado / valor_orcado * 100."
      - name: status_arrecadacao
        description: "Status: 'superavit' (>= 105%), 'dentro_meta' (90-105%), 'abaixo_meta' (< 90%), 'nao_arrecadado', 'sem_meta'."
      - name: is_abaixo_meta
        description: "Verdadeiro quando arrecadado é inferior a 90% do valor orçado."
      - name: updated_at
        description: "Timestamp da última atualização."
