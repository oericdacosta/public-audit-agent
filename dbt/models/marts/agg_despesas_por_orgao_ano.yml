version: 2

models:
  - name: agg_despesas_por_orgao_ano
    description: >
      Agregação anual de despesas por órgão com ranking e participação no total.
      Otimizada para perguntas de alto nível sobre distribuição de gastos entre
      secretarias. Inclui percentual de execução e participação no orçamento total.
      Granularidade: uma linha por (municipio_id, ano_exercicio, codigo_orgao).
    columns:
      - name: municipio_id
        description: "Identificador do município."
      - name: nome_municipio
        description: "Nome do município (desnormalizado)."
      - name: ano_exercicio
        description: "Ano fiscal."
      - name: codigo_orgao
        description: "Código do órgão."
      - name: nome_orgao
        description: "Nome do órgão (ex: Secretaria Municipal de Saúde)."
      - name: total_empenhado_ano
        description: "Total empenhado pelo órgão no ano em R$."
        meta:
          semantic_type: monetary_brl
      - name: total_liquidado_ano
        description: "Total liquidado pelo órgão no ano em R$."
        meta:
          semantic_type: monetary_brl
      - name: total_pago_ano
        description: "Total pago pelo órgão no ano em R$."
        meta:
          semantic_type: monetary_brl
      - name: total_nao_pago_ano
        description: "Total liquidado e não pago pelo órgão no ano em R$."
        meta:
          semantic_type: monetary_brl
      - name: percentual_executado_ano
        description: "Percentual de execução anual do órgão: pago / empenhado * 100."
        meta:
          semantic_type: ratio
      - name: participacao_no_total_pct
        description: "Participação do órgão no gasto total pago do município no ano (%)."
        meta:
          semantic_type: ratio
      - name: rank_gasto_no_ano
        description: "Posição do órgão no ranking de maiores gastadores do ano (1 = maior)."
        meta:
          semantic_type: count
