version: 2

models:
  - name: stg_unidades_orcamentarias
    description: "Unidades orçamentárias do município (dimensão). Granularidade: uma unidade por linha."
    columns:
      - name: unidade_orcamentaria_id
        description: "Chave primária."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Código do município."
        tests: [not_null]
      - name: codigo_unidade_orcamentaria
        description: "Código da unidade."
      - name: descricao_unidade_orcamentaria
        description: "Nome da unidade orçamentária."
      - name: ano_exercicio
        description: "Ano de exercício orçamentário."
      - name: updated_at
        description: "Timestamp da última carga."
