version: 2

models:
  - name: int_compras_diretas
    description: "Compras realizadas por dispensa ou inexigibilidade de licitação (modalidades 6 e 7). Granularidade: uma linha por licitacao_id onde is_dispensa = true. Nota: a junção com stg_contratos via numero_processo não é possível pois ambos os campos são nulos."
    columns:
      - name: licitacao_id
        description: "Chave primária da licitação (dispensa ou inexigibilidade)."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Identificador do município."
      - name: ano_exercicio
        description: "Ano de exercício fiscal."
      - name: numero_licitacao
        description: "Número da licitação/dispensa."
      - name: numero_processo
        description: "Número do processo administrativo. Nulo na fonte."
      - name: objeto_licitacao
        description: "Descrição do objeto. Nulo na fonte."
      - name: modalidade_licitacao
        description: "Código da modalidade: 6=Dispensa, 7=Inexigibilidade."
      - name: modalidade_licitacao_label
        description: "Descrição da modalidade de licitação."
      - name: is_dispensa
        description: "Verdadeiro — todas as linhas deste modelo são dispensas ou inexigibilidades."
      - name: is_pregao
        description: "Falso para todos os registros deste modelo."
      - name: data_realizacao
        description: "Data de realização da compra direta."
      - name: ano_realizacao
        description: "Ano de realização extraído de data_realizacao."
      - name: valor_estimado
        description: "Valor estimado da compra direta."
      - name: is_alto_valor
        description: "Verdadeiro quando o valor estimado supera R$650 mil."
      - name: faixa_valor
        description: "Faixa de valor estimado."
      - name: situacao_licitacao
        description: "Situação da licitação. Nula na fonte."
      - name: flag_licitacao_deserta
        description: "Verdadeiro quando nenhum licitante participou."
      - name: flag_unico_participante
        description: "Verdadeiro quando apenas um licitante participou."
      - name: quantidade_licitantes
        description: "Quantidade de licitantes."
      - name: total_itens
        description: "Total de itens."
      - name: valor_total_vencedor
        description: "Valor total dos itens vencedores."
      - name: flag_valor_acima_limite_dispensa
        description: "Verdadeiro quando o valor estimado supera R$50 mil (limite típico para dispensa)."
      - name: updated_at
        description: "Timestamp da última atualização do registro."
