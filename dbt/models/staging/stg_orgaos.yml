version: 2

models:
  - name: stg_orgaos
    description: "Órgãos da administração municipal (dimensão). Granularidade: um órgão por linha."
    columns:
      - name: orgao_id
        description: "Chave primária."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Código do município."
        tests: [not_null]
      - name: codigo_orgao
        description: "Código do órgão."
      - name: descricao_orgao
        description: "Nome do órgão."
      - name: ano_exercicio
        description: "Ano de exercício orçamentário."
      - name: updated_at
        description: "Timestamp da última carga."
