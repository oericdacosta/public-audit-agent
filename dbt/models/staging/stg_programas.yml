version: 2

models:
  - name: stg_programas
    description: "Programas orçamentários municipais (dimensão). Granularidade: um programa por linha."
    columns:
      - name: programa_id
        description: "Chave primária."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Código do município."
        tests: [not_null]
      - name: codigo_programa
        description: "Código do programa."
      - name: descricao_programa
        description: "Descrição do programa."
      - name: ano_exercicio
        description: "Ano de exercício orçamentário."
      - name: updated_at
        description: "Timestamp da última carga."
