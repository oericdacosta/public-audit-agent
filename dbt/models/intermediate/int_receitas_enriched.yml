version: 2

models:
  - name: int_receitas_enriched
    description: "Receitas orçamentárias enriquecidas com informações de órgãos e unidades orçamentárias. Granularidade: uma linha por receita_id. Nota: stg_orcamento_receita não é utilizada pois codigo_receita é nulo em ambas as tabelas, impossibilitando a junção."
    columns:
      - name: receita_id
        description: "Chave primária da receita."
        tests: [unique, not_null]
      - name: municipio_id
        description: "Identificador do município."
      - name: ano_exercicio
        description: "Ano de exercício fiscal."
      - name: mes_referencia
        description: "Mês de referência no formato YYYYMM."
      - name: mes_referencia_date
        description: "Mês de referência convertido para tipo date (primeiro dia do mês)."
      - name: trimestre
        description: "Trimestre do ano: T1, T2, T3 ou T4."
      - name: codigo_orgao
        description: "Código do órgão responsável pela receita."
      - name: nome_orgao
        description: "Nome do órgão com fallback para código quando descrição é nula."
      - name: codigo_unidade_orcamentaria
        description: "Código da unidade orçamentária."
      - name: nome_unidade_orcamentaria
        description: "Nome da unidade orçamentária com fallback para código quando descrição é nula."
      - name: codigo_receita
        description: "Código da receita. Nulo na fonte de dados."
      - name: descricao_receita
        description: "Descrição da receita. Nula na fonte de dados."
      - name: valor_orcado
        description: "Valor orçado para arrecadação."
      - name: valor_arrecadado
        description: "Valor efetivamente arrecadado."
      - name: percentual_arrecadado
        description: "Percentual de arrecadação sobre o orçado. Nulo quando valor_orcado é zero."
      - name: desvio_arrecadacao
        description: "Diferença entre valor arrecadado e valor orçado. Positivo indica superávit."
      - name: status_arrecadacao
        description: "Status de arrecadação: sem_meta, superavit, dentro_meta, abaixo_meta ou nao_arrecadado."
      - name: is_abaixo_meta
        description: "Verdadeiro quando a arrecadação for inferior a 90% do orçado."
      - name: updated_at
        description: "Timestamp da última atualização do registro."
