version: 2

models:
  - name: agg_despesas_por_funcao_ano
    description: >
      Agregação anual de despesas por função orçamentária (Saúde, Educação,
      Administração etc.). Tabela de referência para análise de políticas públicas
      e prioridades orçamentárias. Inclui ranking e participação percentual no total.
      Granularidade: uma linha por (municipio_id, ano_exercicio, codigo_funcao).
    columns:
      - name: municipio_id
        description: "Identificador do município."
      - name: nome_municipio
        description: "Nome do município (desnormalizado)."
      - name: ano_exercicio
        description: "Ano fiscal."
      - name: codigo_funcao
        description: "Código da função orçamentária (ex: 10 = Saúde, 12 = Educação)."
      - name: nome_funcao
        description: "Nome da área de política pública (ex: Saúde, Educação, Saneamento Básico)."
      - name: total_empenhado_ano
        description: "Total empenhado na função durante o ano em R$."
        meta:
          semantic_type: monetary_brl
      - name: total_liquidado_ano
        description: "Total liquidado na função durante o ano em R$."
        meta:
          semantic_type: monetary_brl
      - name: total_pago_ano
        description: "Total pago na função durante o ano em R$."
        meta:
          semantic_type: monetary_brl
      - name: percentual_executado
        description: "Taxa de execução da função no ano: pago / empenhado * 100."
        meta:
          semantic_type: ratio
      - name: percentual_orcamento_total
        description: "Participação percentual da função no orçamento total pago do município."
        meta:
          semantic_type: ratio
      - name: rank_funcao_no_ano
        description: "Posição da função no ranking de maiores gastos do ano (1 = maior)."
        meta:
          semantic_type: count
      - name: status_qualidade
        description: >
          Classificação de qualidade dos dados para este (municipio_id, ano_exercicio, nome_funcao):
          DADOS_CONSOLIDADOS, DADOS_PARCIAIS, DADOS_POSSIVELMENTE_INCOMPLETOS, ZERO_SEM_HISTORICO,
          SEM_DADOS_ETL. NULL quando não há dados de qualidade disponíveis.
      - name: explicacao_qualidade
        description: "Texto explicativo sobre o status dos dados. Usar literalmente na resposta ao usuário."
      - name: anos_com_historico_nao_zero
        description: "Número de anos anteriores com execução não-nula para esta função no município."
        meta:
          semantic_type: count
