version: 2

models:
  - name: int_despesas
    description: "Cleaned and enriched atomic expense records. Granularity: One row per expense transaction."
    columns:
      - name: despesa_id
        description: "Unique identifier for the expense transaction"
        tests:
          - unique
          - not_null
      - name: municipio_id
        description: "Identifier of the municipality"
        tests:
          - not_null
      - name: ano_exercicio
        description: "Fiscal year of the budget"
      - name: mes_referencia
        description: "Reference month of the expense"
      - name: codigo_orgao
        description: "Code of the organization"
      - name: codigo_unidade_orcamentaria
        description: "Code of the budgetary unit"
      - name: codigo_funcao
        description: "Functional classification code"
      - name: codigo_subfuncao
        description: "Sub-functional classification code"
      - name: codigo_programa
        description: "Program code"
      - name: codigo_elemento_despesa
        description: "Expense element code"
      - name: valor_empenhado
        description: "Committed value (Empenhado)"
      - name: valor_liquidado
        description: "Liquidated value (Liquidado)"
      - name: valor_pago
        description: "Paid value (Pago)"
      - name: data_carga
        description: "Timestamp of data loading"
      - name: nome_funcao_macro
        description: "Macro name of the function (e.g., Educação, Saúde)"
      - name: is_pago_totalmente
        description: "Boolean indicating if paid value meets or exceeds liquidated value"

  - name: int_licitacoes
    description: "Cleaned and enriched atomic bidding processes. Granularity: One row per bidding process."
    columns:
      - name: licitacao_id
        description: "Unique identifier for the bidding process"
        tests:
          - unique
          - not_null
      - name: municipio_id
        description: "Identifier of the municipality"
        tests:
          - not_null
      - name: numero_licitacao
        description: "Bidding number"
      - name: numero_processo
        description: "Process number"
      - name: objeto_licitacao
        description: "Description of the bidding object"
      - name: modalidade_licitacao
        description: "Modality of the bidding process (eg. Pregão, Leilão)"
      - name: data_realizacao
        description: "Date when the bidding took place"
      - name: valor_estimado
        description: "Estimated value of the bidding"
      - name: situacao_licitacao
        description: "Current status of the bidding process"
      - name: ano_exercicio
        description: "Fiscal year"
      - name: data_carga
        description: "Timestamp of data loading"
      - name: nome_modalidade
        description: "Decoded modality name (e.g., Pregão, Convite)"
      - name: faixa_valor_estimado
        description: "Value range classification (Alto/Médio/Baixo)"

  - name: int_receitas
    description: "Cleaned and enriched atomic revenue records. Granularity: One row per revenue transaction."
    columns:
      - name: receita_id
        description: "Unique identifier for the revenue transaction"
        tests:
          - unique
          - not_null
      - name: municipio_id
        description: "Identifier of the municipality"
        tests:
          - not_null
      - name: ano_exercicio
        description: "Fiscal year"
      - name: mes_referencia
        description: "Reference month"
      - name: codigo_orgao
        description: "Code of the organization"
      - name: codigo_unidade_orcamentaria
        description: "Code of the budgetary unit"
      - name: codigo_receita
        description: "Revenue classification code"
      - name: descricao_receita
        description: "Description of the revenue source"
      - name: valor_orcado
        description: "Budgeted value"
      - name: valor_arrecadado
        description: "Collected (arrecadado) value"
      - name: data_carga
        description: "Timestamp of data loading"
